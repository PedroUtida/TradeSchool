<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troca Escolar – Anunciar material</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="user-menu">
          <button class="icon-btn" id="user-btn" aria-label="Menu do usuário" aria-expanded="false"><img src="img/usuario.png" alt="" class="icon-img"></button>
          <ul class="dropdown" id="user-dropdown" hidden>
            <li><a href="usuario.html">Meu perfil</a></li>
            <li><a href="carrinho.html">Carrinho</a></li>
            <li><a href="anunciar.html">Anunciar material</a></li>
          </ul>
        </div>
        <a class="logo" href="index.html">Troca Escolar</a>
      </div>
      <form class="search" id="search-form" role="search">
        <input type="search" id="search-input" placeholder="Pesquisar produto..." aria-label="Pesquisar produto">
        <button type="submit" aria-label="Buscar">🔍</button>
      </form>
      <a class="cart-link" href="carrinho.html">🛒 <span id="cart-count">0</span></a>
    </div>
  </header>

  <main>
    <h1 class="page-title">Anunciar material</h1>

    <section class="card">
      <h2>Doe, troque ou venda</h2>
      <form id="anuncio-form">
        <div class="form-grid">
          <div class="campo largo">
            <label for="nome">Nome do material</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex.: Livro de Matemática 8º ano">
          </div>
          <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria">
              <option>Livros escolares</option>
              <option>Materiais escolares</option>
              <option>Livros para o ENEM</option>
            </select>
          </div>
          <div class="campo">
            <label for="condicao">Condição</label>
            <select id="condicao" name="condicao">
              <option>Novo</option>
              <option selected>Bom estado</option>
              <option>Usado</option>
            </select>
          </div>
          <div class="campo">
            <label for="tipo">O que deseja fazer?</label>
            <select id="tipo" name="tipo">
              <option>Doação</option>
              <option>Troca</option>
              <option>Venda</option>
            </select>
          </div>
          <div class="campo" id="campo-preco" hidden>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="0,00">
          </div>
          <div class="campo largo">
            <label for="descricao">Descrição / o que aceita em troca</label>
            <textarea id="descricao" name="descricao" rows="3" placeholder="Detalhes do material"></textarea>
          </div>
        </div>
        <div class="acoes">
          <button class="btn" type="submit">Publicar anúncio</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Meus anúncios</h2>
      <div class="anuncios-grid" id="anuncios-lista"></div>
    </section>
  </main>

  <footer class="site-footer">
    <nav>
      <a href="index.html">Home</a>
      <a href="usuario.html">Meu perfil</a>
      <a href="carrinho.html">Carrinho</a>
      <a href="anunciar.html">Anunciar material</a>
    </nav>
    <p>© Troca Escolar – educação ao alcance de todos 💙</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
