<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troca Escolar – Meu perfil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="user-menu">
          <button class="icon-btn" id="user-btn" aria-label="Menu do usuário" aria-expanded="false"><img src="img/usuario.png" alt="" class="icon-img"></button>
          <ul class="dropdown" id="user-dropdown" hidden>
            <li><a href="usuario.html">Meu perfil</a></li>
            <li><a href="carrinho.html">Carrinho</a></li>
            <li><a href="anunciar.html">Anunciar material</a></li>
          </ul>
        </div>
        <a class="logo" href="index.html"> Troca Escolar</a>
      </div>
      <form class="search" id="search-form" role="search">
        <input type="search" id="search-input" placeholder="Pesquisar produto..." aria-label="Pesquisar produto">
        <button type="submit" aria-label="Buscar">🔍</button>
      </form>
      <a class="cart-link" href="carrinho.html">🛒 <span id="cart-count">0</span></a>
    </div>
  </header>

  <main>
    <h1 class="page-title">Meu perfil</h1>

    <section class="card" id="perfil-resumo" hidden>
      <div class="perfil-topo">
        <div class="avatar" id="avatar">?</div>
        <h2 id="res-nome"></h2>
      </div>
      <ul class="dados-lista">
        <li><strong>E-mail:</strong> <span id="res-email"></span></li>
        <li><strong>Telefone:</strong> <span id="res-telefone"></span></li>
        <li><strong>Cidade:</strong> <span id="res-cidade"></span></li>
        <li><strong>Estado:</strong> <span id="res-estado"></span></li>
        <li><strong>Bairro:</strong> <span id="res-bairro"></span></li>
      </ul>
    </section>

    <section class="card">
      <h2>Dados pessoais</h2>
      <form id="user-form">
        <div class="form-grid">
          <div class="campo largo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex.: Maria da Silva Santos">
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com">
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 90000-0000">
          </div>
          <div class="campo">
            <label for="cidade">Cidade (localidade)</label>
            <input type="text" id="cidade" name="cidade" required placeholder="Ex.: Osasco">
          </div>
          <div class="campo">
            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado" placeholder="Ex.: SP" maxlength="2">
          </div>
          <div class="campo largo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" placeholder="Ex.: Centro">
          </div>
        </div>
        <div class="acoes">
          <button class="btn" type="submit">Salvar dados</button>
          <a class="btn secundario" href="index.html">Voltar para a home</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <nav>
      <a href="index.html">Home</a>
      <a href="usuario.html">Meu perfil</a>
      <a href="carrinho.html">Carrinho</a>
      <a href="anunciar.html">Anunciar material</a>
    </nav>
    <p>© Troca Escolar – educação ao alcance de todos </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
